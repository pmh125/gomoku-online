<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="支持房间联机的双人五子棋" />
  <title>五子棋 · 在线对弈</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --ink: #1d2433;
      --muted: #7b8496;
      --border: #e6eaf1;
      --accent: #5f76d6;
      --accent-dark: #4e65c3;
      --accent-soft: #edf0ff;
      --wood: #b7a083;
      --wood-dark: #947d64;
      --grid: #5d5043;
      --white-stone: #d4d5cf;
      --black-stone: #3d424b;
      --shadow: 0 24px 70px rgba(54, 71, 110, 0.12), 0 3px 10px rgba(54, 71, 110, 0.05);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(95, 118, 214, 0.07), transparent 33%),
        radial-gradient(circle at 88% 92%, rgba(217, 168, 108, 0.09), transparent 29%),
        var(--bg);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    .page { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 42px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--ink); box-shadow: 0 8px 18px rgba(29, 36, 51, .2); }
    .brand-mark::before { content: ""; width: 17px; height: 17px; border-radius: 50%; background: var(--white-stone); box-shadow: 9px 8px 0 var(--accent); }
    .brand-name { font-size: 19px; font-weight: 700; letter-spacing: .04em; }
    .brand-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .offline { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .offline-dot { width: 7px; height: 7px; border-radius: 50%; background: #53b487; box-shadow: 0 0 0 4px rgba(83, 180, 135, .14); }

    .online-bar { display: flex; align-items: center; gap: 14px; padding: 14px 17px; margin-bottom: 18px; border: 1px solid var(--border); border-radius: var(--radius-md); background: rgba(255,255,255,.78); box-shadow: 0 7px 22px rgba(54,71,110,.05); }
    .online-copy { min-width: 158px; }
    .online-title { font-size: 13px; font-weight: 700; }
    .online-detail { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .room-controls { display: flex; align-items: center; gap: 8px; flex: 1; }
    .room-input { width: min(220px, 100%); height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; color: var(--ink); background: #fff; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    .room-input:focus { border-color: #aeb9e9; box-shadow: 0 0 0 3px rgba(95,118,214,.12); }
    .room-name { width: min(130px, 100%); height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; outline: none; color: var(--ink); background: #fff; font-size: 12px; }
    .room-name:focus { border-color: #aeb9e9; box-shadow: 0 0 0 3px rgba(95,118,214,.12); }
    .role-choices { display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: #fff; white-space: nowrap; }
    .role-label { padding: 0 4px 0 6px; color: var(--muted); font-size: 11px; }
    .role-choice { height: 30px; padding: 0 8px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; cursor: pointer; font-size: 11px; }
    .role-choice.active { color: var(--ink); background: #eef1fb; box-shadow: inset 0 0 0 1px rgba(95,118,214,.16); }
    .role-choice:disabled { opacity: .42; cursor: not-allowed; }
    .room-button { height: 38px; padding: 0 13px; border: 1px solid var(--border); border-radius: 10px; color: var(--ink); background: #fff; cursor: pointer; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .room-button.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .room-button:disabled { opacity: .45; cursor: not-allowed; }
    .room-state { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .room-state strong { color: var(--ink); font-weight: 700; }
    .room-members { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }

    .game-shell { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: stretch; }
    .board-panel, .side-panel { background: var(--surface); border: 1px solid rgba(230, 234, 241, .9); box-shadow: var(--shadow); backdrop-filter: blur(16px); }
    .board-panel { border-radius: var(--radius-lg); padding: clamp(18px, 3vw, 34px); display: flex; flex-direction: column; min-width: 0; }
    .board-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 22px; }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0 0; font-size: clamp(27px, 4vw, 38px); line-height: 1.1; letter-spacing: -.04em; }
    .turn-card { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: 13px; background: var(--accent-soft); color: var(--accent-dark); font-size: 13px; white-space: nowrap; }
    .turn-stone { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0,0,0,.1); opacity: .86; box-shadow: inset -1px -1px 3px rgba(0,0,0,.1), inset 1px 1px 2px rgba(255,255,255,.3); }
    .turn-stone.black { background: var(--black-stone); }
    .turn-stone.white { background: var(--white-stone); }
    .board-wrap { width: min(100%, 650px); margin: 0 auto; aspect-ratio: 1; position: relative; }
    canvas { display: block; width: 100%; height: 100%; border-radius: 0; cursor: crosshair; touch-action: manipulation; }
    @media (hover: hover) and (pointer: fine) {
      .board-wrap canvas { opacity: 0; transition: opacity .2s ease; }
      .board-wrap:hover canvas { opacity: 1; }
    }
    @media (hover: none), (pointer: coarse) {
      .board-wrap canvas { opacity: 1; }
    }
    .board-hint { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-top: 17px; }
    .board-hint span:last-child { text-align: right; }

    .side-panel { border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column; }
    .section-label { margin: 0 0 15px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .status-box { padding: 17px; border-radius: var(--radius-md); background: #f8f9fd; border: 1px solid var(--border); margin-bottom: 21px; }
    .status-main { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
    .status-detail { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .action { min-height: 42px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); color: var(--ink); background: var(--surface-solid); cursor: pointer; font-size: 13px; font-weight: 650; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease; }
    .action:hover:not(:disabled) { transform: translateY(-1px); border-color: #c9d1e8; box-shadow: 0 6px 14px rgba(53, 70, 110, .09); }
    .action:active:not(:disabled) { transform: translateY(0); }
    .action.primary { border-color: var(--accent); background: var(--accent); color: #fff; box-shadow: 0 7px 16px rgba(95, 118, 214, .22); }
    .action.primary:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
    .action:disabled { opacity: .42; cursor: not-allowed; }
    .history { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .history-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
    .count { color: var(--muted); font-size: 12px; }
    .move-list { max-height: 235px; overflow: auto; border-top: 1px solid var(--border); scrollbar-width: thin; }
    .move-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-bottom: 1px solid #f0f2f6; color: #4e576a; font-size: 13px; }
    .move-row:last-child { border-bottom: 0; }
    .move-index { color: var(--muted); font-variant-numeric: tabular-nums; width: 30px; }
    .move-player { display: inline-flex; align-items: center; gap: 8px; flex: 1; }
    .mini-stone { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,.1); opacity: .86; box-shadow: inset -1px -1px 3px rgba(0,0,0,.1), inset 1px 1px 2px rgba(255,255,255,.3); }
    .mini-stone.black { background: var(--black-stone); }
    .mini-stone.white { background: var(--white-stone); }
    .empty-history { padding: 23px 2px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .room-info-panel { margin-bottom: 18px; }
    .member-list { max-height: 112px; overflow: auto; border-top: 1px solid var(--border); scrollbar-width: thin; }
    .member-row { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid #f0f2f6; color: #4e576a; font-size: 12px; }
    .member-row:last-child { border-bottom: 0; }
    .member-dot { width: 8px; height: 8px; border-radius: 50%; background: #aeb5c2; }
    .member-role { margin-left: auto; color: var(--muted); font-size: 11px; }
    .chat-panel { min-height: 0; display: flex; flex: 1; flex-direction: column; }
    .chat-list { min-height: 90px; max-height: 190px; overflow: auto; border-top: 1px solid var(--border); scrollbar-width: thin; }
    .chat-message { padding: 8px 2px; border-bottom: 1px solid #f0f2f6; color: #4e576a; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .chat-message strong { color: var(--ink); font-weight: 650; }
    .chat-message.self strong { color: var(--accent-dark); }
    .empty-chat { padding: 16px 2px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .chat-form { display: flex; gap: 7px; margin-top: 9px; }
    .chat-input, .alternate-url, .switch-mode { min-width: 0; height: 34px; padding: 0 9px; border: 1px solid var(--border); border-radius: 9px; outline: none; color: var(--ink); background: #fff; font-size: 12px; }
    .chat-input { flex: 1; }
    .chat-input:focus, .alternate-url:focus, .switch-mode:focus { border-color: #aeb9e9; box-shadow: 0 0 0 3px rgba(95,118,214,.12); }
    .chat-send { height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; color: var(--ink); background: #fff; cursor: pointer; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .chat-send:disabled { opacity: .45; cursor: not-allowed; }
    .switch-settings { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--border); }
    .switch-row { display: flex; gap: 7px; margin-top: 8px; }
    .alternate-url { flex: 1; }
    .switch-mode-label { display: block; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .switch-mode { width: 100%; margin-top: 6px; }
    .switch-toggle { width: 100%; height: 34px; margin-top: 8px; border: 1px solid var(--accent); border-radius: 9px; color: #fff; background: var(--accent); cursor: pointer; font-size: 11px; font-weight: 650; }
    .switch-toggle.active { border-color: #aeb7ce; color: var(--ink); background: #eef1f7; }
    .footer-note { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; line-height: 1.65; }

    .alternate-panel { position: fixed; inset: 0; z-index: 30; display: flex; align-items: stretch; justify-content: stretch; visibility: hidden; opacity: 0; pointer-events: none; background: #fff; transition: opacity .12s ease, visibility .12s ease; }
    .alternate-panel iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .alternate-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: #f8f9fd; font-size: 14px; }
    .alternate-panel.has-frame .alternate-empty { display: none; }
    .alternate-settings { position: absolute; top: 16px; right: 16px; height: 34px; padding: 0 12px; border: 1px solid rgba(215,220,232,.95); border-radius: 9px; color: var(--ink); background: rgba(255,255,255,.9); box-shadow: 0 5px 16px rgba(30,40,65,.12); cursor: pointer; font-size: 12px; pointer-events: auto; }
    body.alternate-mode .alternate-panel { visibility: visible; opacity: 1; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; padding: 11px 16px; border-radius: 999px; color: #fff; background: rgba(29, 36, 51, .92); box-shadow: 0 9px 24px rgba(29, 36, 51, .24); font-size: 13px; transition: opacity .22s ease, transform .22s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    :focus-visible { outline: 3px solid rgba(95, 118, 214, .35); outline-offset: 3px; }

    @media (max-width: 860px) {
      .page { width: min(680px, calc(100% - 28px)); padding-top: 20px; }
      .online-bar { align-items: stretch; flex-direction: column; gap: 10px; }
      .room-controls { flex-wrap: wrap; }
      .room-state { margin-left: 0; text-align: left; }
      .room-members { margin-left: 0; }
      .game-shell { grid-template-columns: 1fr; }
      .side-panel { padding: 20px; }
      .move-list { max-height: 190px; }
    }
    @media (max-width: 480px) {
      .page { width: calc(100% - 20px); padding-bottom: 25px; }
      .topbar { margin-bottom: 20px; }
      .online-bar { padding: 13px; }
      .room-controls { display: grid; grid-template-columns: 1fr 1fr; }
      .room-input { width: 100%; grid-column: 1 / -1; }
      .room-name { width: 100%; }
      .role-choices { width: 100%; justify-content: space-between; }
      .role-choice { flex: 1; }
      .room-button { width: 100%; }
      .brand-mark { width: 36px; height: 36px; border-radius: 11px; }
      .brand-mark::before { width: 15px; height: 15px; box-shadow: 7px 7px 0 var(--accent); }
      .brand-name { font-size: 17px; }
      .offline { font-size: 11px; }
      .board-panel { padding: 15px; border-radius: 19px; }
      .board-header { align-items: flex-start; flex-direction: column; margin-bottom: 16px; }
      .turn-card { align-self: stretch; justify-content: center; }
      .board-hint { flex-direction: column; gap: 4px; line-height: 1.5; }
      .board-hint span:last-child { text-align: left; }
      .side-panel { border-radius: 19px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand" aria-label="五子棋">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">五子棋</div>
          <div class="brand-subtitle">安静地下一盘棋</div>
        </div>
      </div>
      <div class="offline" id="availabilityStatus"><span class="offline-dot" aria-hidden="true"></span>可本地运行</div>
    </header>

    <section class="online-bar" aria-label="联机房间">
      <div class="online-copy">
        <div class="online-title">联机房间</div>
        <div class="online-detail">进入房间后默认观战，再选择黑棋或白棋</div>
      </div>
      <div class="room-controls">
        <input class="room-input" id="roomInput" maxlength="6" placeholder="输入 6 位房间号" aria-label="房间号" autocomplete="off" />
        <input class="room-name" id="displayNameInput" maxlength="16" placeholder="你的名字" aria-label="你的名字" autocomplete="nickname" />
        <div class="role-choices" role="group" aria-label="位置选择">
          <span class="role-label">位置</span>
          <button class="role-choice" type="button" data-role="black">黑子</button>
          <button class="role-choice" type="button" data-role="white">白子</button>
          <button class="role-choice active" type="button" data-role="spectator">观战</button>
        </div>
        <button class="room-button primary" id="createRoomBtn" type="button">创建房间</button>
        <button class="room-button" id="joinRoomBtn" type="button">加入房间</button>
        <button class="room-button" id="saveNameBtn" type="button">保存名字</button>
      </div>
      <div class="room-state" id="roomState" aria-live="polite">尚未连接</div>
      <div class="room-members" id="rosterState">黑棋 0/1 · 白棋 0/1 · 观战 0</div>
    </section>

    <section class="game-shell" aria-label="五子棋游戏">
      <section class="board-panel">
        <div class="board-header">
          <div>
            <div class="eyebrow">LOCAL MATCH · 19 × 19</div>
            <h1>轮到谁了？</h1>
          </div>
          <div class="turn-card" id="turnCard"><span class="turn-stone black" id="turnStone" aria-hidden="true"></span><span id="turnText">黑方落子</span></div>
        </div>
        <div class="board-wrap">
          <canvas id="board" role="img" aria-label="15乘15五子棋棋盘"></canvas>
        </div>
        <div class="board-hint"><span>黑方先手 · 横、竖、斜线连成五子获胜</span><span id="lastMoveLabel">等待第一步落子</span></div>
      </section>

      <aside class="side-panel">
        <div class="section-label">当前状态</div>
        <div class="status-box" aria-live="polite">
          <div class="status-main" id="statusMain">对局进行中</div>
          <div class="status-detail" id="statusDetail">黑方先手，点击棋盘开始游戏。</div>
        </div>
        <div class="actions">
          <button class="action primary" id="restartBtn" type="button">重新开始</button>
          <button class="action" id="undoBtn" type="button" disabled>悔棋</button>
        </div>
        <div class="room-info-panel">
          <div class="section-label" style="margin:0">房间成员</div>
          <div class="member-list" id="memberList"><div class="empty-chat">进入房间后显示成员昵称</div></div>
        </div>
        <div class="chat-panel" id="chatPanel">
          <div class="history-head"><div class="section-label" style="margin:0">房间聊天</div><div class="count" id="chatCount">0 条</div></div>
          <div class="chat-list" id="chatList"><div class="empty-chat">进入房间后可以聊天</div></div>
          <form class="chat-form" id="chatForm">
            <input class="chat-input" id="chatInput" maxlength="240" placeholder="说点什么…" autocomplete="off" />
            <button class="chat-send" type="submit">发送</button>
          </form>
        </div>
        <div class="switch-settings">
          <div class="section-label" style="margin:0">个人备用网址</div>
          <div class="switch-row"><input class="alternate-url" id="alternateUrlInput" placeholder="https://example.com" inputmode="url" /><button class="chat-send" id="saveAlternateBtn" type="button">保存</button></div>
          <label class="switch-mode-label" for="switchModeSelect">鼠标移出以下区域时切换</label>
          <select class="switch-mode" id="switchModeSelect">
            <option value="board">棋盘区域</option>
            <option value="chat">聊天区域</option>
            <option value="board-chat">棋盘和聊天区域</option>
            <option value="none">不自动切换</option>
          </select>
          <button class="switch-toggle" id="switchToggleBtn" type="button">启动切换</button>
        </div>
        <div class="footer-note">备用网址和切换设置只保存在当前浏览器；外部网站若禁止 iframe 嵌入，将显示备用提示。</div>
      </aside>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="alternate-panel" id="alternatePanel" aria-hidden="true">
    <iframe id="alternateFrame" title="个人备用网址" loading="eager"></iframe>
    <div class="alternate-empty" id="alternateEmpty">请在右侧设置你的备用网址</div>
    <button class="alternate-settings" id="alternateSettingsBtn" type="button">打开房间和设置</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      async function openRoom(code) {

        if (joinResult.error || !joinResult.data?.ok) {

        realtime.channel.on('broadcast', { event: 'room-message' }, ({ payload }) => {
          if (!payload || payload.senderId === clientId) return;
          if (payload.type === 'state-request') sendRoomMessage({ type: 'state', state: getState() });
          if (payload.type === 'state') {

      function validAlternateUrl(value) {

      function loadAlternateSettings() {

      function updatePointerMode() {
        const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        if (!switchEnabled || !canHover || switchModeSelect.value === 'none') {
          document.body.classList.remove('alternate-mode');
          alternatePanel.setAttribute('aria-hidden', 'true');
          return;
        }
        const boardHover = boardWrap.matches(':hover');
        const chatHover = chatPanel.matches(':hover');
        if (settingsUnlocked && !boardHover && !chatHover) {
          document.body.classList.remove('alternate-mode');
          alternatePanel.setAttribute('aria-hidden', 'true');
          return;
        }
        if (boardHover || chatHover) settingsUnlocked = false;
        const mode = switchModeSelect.value;
        const inTrigger = mode === 'board' ? boardHover : mode === 'chat' ? chatHover : boardHover || chatHover;
        document.body.classList.toggle('alternate-mode', !inTrigger);
        alternatePanel.setAttribute('aria-hidden', String(inTrigger));
      }

      function broadcastState() {
        if (realtime.connected) sendRoomMessage({ type: 'state', state: getState() });
      }

      function fitCanvas() {
        const size = Math.max(280, Math.floor(boardWrap.clientWidth));
        const ratio = window.devicePixelRatio || 1;
        boardCanvas.width = size * ratio;
        boardCanvas.height = size * ratio;
        boardCanvas.style.width = size + 'px';
        boardCanvas.style.height = size + 'px';
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        padding = size * 0.065;
        cellSize = (size - padding * 2) / (SIZE - 1);
        draw();
      }

      function roundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function draw() {
        const size = boardCanvas.clientWidth;
        if (!size) return;
        ctx.clearRect(0, 0, size, size);
        ctx.strokeStyle = 'rgba(65, 61, 54, .34)';
        ctx.lineWidth = Math.max(1, size * .00165);
        for (let i = 0; i < SIZE; i++) {
          const p = padding + i * cellSize;
          ctx.beginPath(); ctx.moveTo(padding, p); ctx.lineTo(size - padding, p); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(p, padding); ctx.lineTo(p, size - padding); ctx.stroke();
        }

        const stars = [ [3, 3], [9, 3], [15, 3], [3, 9], [9, 9], [15, 9], [3, 15], [9, 15], [15, 15] ];
        ctx.fillStyle = 'rgba(65, 61, 54, .4)';
        stars.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(padding + x * cellSize, padding + y * cellSize, size * .0072, 0, Math.PI * 2); ctx.fill(); });

        if (hoverCell && canPreviewMove() && board[hoverCell.y][hoverCell.x] === 0) drawHover(hoverCell.x, hoverCell.y);
        const lastMove = moves[moves.length - 1];
        for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (board[y][x]) drawStone(x, y, board[y][x], Boolean(lastMove && lastMove.x === x && lastMove.y === y));
        if (winningLine.length) drawWinningLine();
      }

      function drawHover(x, y) {
        const px = padding + x * cellSize, py = padding + y * cellSize;
        ctx.save();
        ctx.globalAlpha = .2;
        ctx.fillStyle = currentPlayer === 1 ? '#171b24' : '#f7f1e6';
        ctx.strokeStyle = currentPlayer === 1 ? '#171b24' : '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(px, py, cellSize * .32, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
      }

      function canPreviewMove() {
        return !gameOver && (!realtime.connected || realtime.myPlayer === currentPlayer);
      }

      function drawStone(x, y, player, isLastMove = false) {
        const px = padding + x * cellSize, py = padding + y * cellSize, r = cellSize * .34;
        const gradient = ctx.createRadialGradient(px - r * .32, py - r * .38, r * .12, px, py, r);
        if (player === 1) { gradient.addColorStop(0, '#858b93'); gradient.addColorStop(.35, '#737a83'); gradient.addColorStop(1, '#626a74'); }
        else { gradient.addColorStop(0, '#e3e3dd'); gradient.addColorStop(.55, '#d4d5cf'); gradient.addColorStop(1, '#bfc1bb'); }
        ctx.save();
        ctx.globalAlpha = .78;
        ctx.shadowColor = 'rgba(57, 35, 20, .12)'; ctx.shadowBlur = r * .18; ctx.shadowOffsetY = r * .08;
        ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = player === 1 ? 'rgba(255,255,255,.04)' : 'rgba(78,78,72,.16)'; ctx.lineWidth = 1; ctx.stroke();
        if (isLastMove) {
          ctx.globalAlpha = .62;
          ctx.strokeStyle = 'rgba(95, 118, 214, .68)';
          ctx.lineWidth = Math.max(1.2, cellSize * .028);
          ctx.beginPath(); ctx.arc(px, py, r * 1.16, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = .72;
          ctx.fillStyle = 'rgba(95, 118, 214, .72)';
          ctx.beginPath(); ctx.arc(px, py, Math.max(1.5, r * .095), 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }

      function drawWinningLine() {
        if (winningLine.length < 2) return;
        const start = winningLine[0], end = winningLine[winningLine.length - 1];
        ctx.save(); ctx.strokeStyle = '#5f76d6'; ctx.lineWidth = Math.max(3, cellSize * .12); ctx.lineCap = 'round'; ctx.globalAlpha = .86;
        ctx.beginPath(); ctx.moveTo(padding + start.x * cellSize, padding + start.y * cellSize); ctx.lineTo(padding + end.x * cellSize, padding + end.y * cellSize); ctx.stroke(); ctx.restore();
      }

      function getCell(event) {
        const rect = boardCanvas.getBoundingClientRect();
        const x = (event.clientX - rect.left - padding) / cellSize;
        const y = (event.clientY - rect.top - padding) / cellSize;
        const cellX = Math.round(x), cellY = Math.round(y);
        if (cellX < 0 || cellX >= SIZE || cellY < 0 || cellY >= SIZE) return null;
        const distance = Math.hypot(x - cellX, y - cellY);
        return distance <= .46 ? { x: cellX, y: cellY } : null;
      }

      function handleMove(event) {
        const cell = getCell(event);
        if (!cell || gameOver || board[cell.y][cell.x]) return;
        if (realtime.connected && realtime.myPlayer === 0) { showToast('观战中，不能落子'); return; }
        if (realtime.connected && realtime.myPlayer !== currentPlayer) { showToast('还没轮到你'); return; }
        board[cell.y][cell.x] = currentPlayer;
        moves.push({ x: cell.x, y: cell.y, player: currentPlayer });
        const player = currentPlayer;
        const line = findWinningLine(cell.x, cell.y, player);
        if (line) {
          winningLine = line;
          gameOver = true;
          updateStatus(`${players[player].name}获胜`, `恭喜！${players[player].name}已经连成五子。`);
          showToast(`${players[player].name}获胜！`);
          lastMoveLabel.textContent = `最后落子：${coord(cell.x, cell.y)}`;
        } else if (moves.length === SIZE * SIZE) {
          gameOver = true;
          updateStatus('和棋', '棋盘已经填满，再来一局吧。');
          showToast('这盘棋是和棋');
          lastMoveLabel.textContent = '棋盘已满';
        } else {
          currentPlayer = currentPlayer === 1 ? 2 : 1;
          updateTurn();
          lastMoveLabel.textContent = `最后落子：${coord(cell.x, cell.y)}`;
        }
        updateRoleButtons(); draw(); broadcastState();
      }

      function findWinningLine(x, y, player) {
        for (const [dx, dy] of directions) {
          const line = [{ x, y }];
          for (const sign of [1, -1]) {
            let nx = x + dx * sign, ny = y + dy * sign;
            while (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && board[ny][nx] === player) { sign === 1 ? line.push({ x: nx, y: ny }) : line.unshift({ x: nx, y: ny }); nx += dx * sign; ny += dy * sign; }
          }
          if (line.length >= 5) return line;
        }
        return null;
      }

      function coord(x, y) { return `${String.fromCharCode(65 + x)}${y + 1}`; }

      function updateTurn() {
        const player = players[currentPlayer];
        turnText.textContent = `${player.name}落子`;
        turnStone.className = `turn-stone ${player.stone}`;
        updateStatus('对局进行中', `${player.name}先手，请点击棋盘选择落点。`);
      }

      function updateStatus(main, detail) { statusMain.textContent = main; statusDetail.textContent = detail; }

      function restart() {
        if (realtime.connected && realtime.myPlayer === 0) { showToast('观战中，不能重新开始'); return; }
        board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); moves = []; currentPlayer = 1; gameOver = false; winningLine = []; hoverCell = null;
        updateTurn(); updateRoleButtons(); lastMoveLabel.textContent = '等待第一步落子'; draw(); broadcastState(); showToast('新对局开始');
      }

      function undo() {
        if (realtime.connected && realtime.myPlayer === 0) { showToast('观战中，不能悔棋'); return; }
        if (!moves.length || gameOver) return;
        const move = moves.pop(); board[move.y][move.x] = 0; currentPlayer = move.player; hoverCell = null; updateTurn(); updateRoleButtons();
        lastMoveLabel.textContent = moves.length ? `最后落子：${coord(moves[moves.length - 1].x, moves[moves.length - 1].y)}` : '等待第一步落子'; draw(); broadcastState(); showToast('已悔棋');
      }

      function showToast(message) { clearTimeout(toastTimer); toast.textContent = message; toast.classList.add('show'); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }

      boardCanvas.addEventListener('click', handleMove);
      boardCanvas.addEventListener('pointermove', (event) => { const next = getCell(event); if (!canPreviewMove() || !next || board[next.y][next.x]) hoverCell = null; else hoverCell = next; draw(); });
      boardCanvas.addEventListener('pointerleave', () => { hoverCell = null; draw(); });
      document.getElementById('restartBtn').addEventListener('click', restart);
      undoBtn.addEventListener('click', undo);
      roomInput.addEventListener('input', () => { roomInput.value = roomInput.value.replace(/[^a-z0-9]/gi, '').slice(0, 6).toUpperCase(); });
      displayNameInput.value = displayName;
      displayNameInput.addEventListener('keydown', event => { if (event.key === 'Enter') saveDisplayName(); });
      createRoomBtn.addEventListener('click', async () => { const code = randomRoomCode(); roomInput.value = code; restart(); await openRoom(code); });
      joinRoomBtn.addEventListener('click', async () => {
        const code = roomCode();
        if (code.length !== 6) { showToast('请输入 6 位房间号'); return; }
        restart();
        await openRoom(code);
      });
      roleButtons.forEach(button => button.addEventListener('click', async () => { await claimRole(button.dataset.role); }));
      saveNameBtn.addEventListener('click', async () => { await saveDisplayName(); });
      chatForm.addEventListener('submit', event => { event.preventDefault(); sendChatMessage(); });
      saveAlternateBtn.addEventListener('click', saveAlternateSettings);
      alternateSettingsBtn.addEventListener('click', () => {
        settingsUnlocked = true;
        document.body.classList.remove('alternate-mode');
        alternatePanel.setAttribute('aria-hidden', 'true');
        showToast('已打开房间和切换设置');
      });
      alternateUrlInput.addEventListener('keydown', event => { if (event.key === 'Enter') saveAlternateSettings(); });
      switchModeSelect.addEventListener('change', () => {
        try { localStorage.setItem(switchModeKey, switchModeSelect.value); } catch (error) { /* localStorage may be unavailable */ }
        updatePointerMode();
      });
      switchToggleBtn.addEventListener('click', () => {
        switchEnabled = !switchEnabled;
        settingsUnlocked = false;
        switchToggleBtn.textContent = switchEnabled ? '停止切换' : '启动切换';
        switchToggleBtn.classList.toggle('active', switchEnabled);
        updatePointerMode();
        showToast(switchEnabled ? '鼠标切换已启动' : '鼠标切换已停止');
      });
      document.addEventListener('mousemove', updatePointerMode);
      document.addEventListener('mouseleave', updatePointerMode);
      window.addEventListener('blur', updatePointerMode);
      window.addEventListener('pagehide', () => {
        if (realtime.client && realtime.roomCode) realtime.client.rpc('leave_gomoku_room', { p_room_code: realtime.roomCode, p_session_id: clientId });
      });
      window.addEventListener('resize', fitCanvas);
      if (onlineConfigured) {
        realtime.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        availabilityStatus.innerHTML = '<span class="offline-dot" aria-hidden="true"></span>可联机';
        setRoomState('待连接', '输入房间号');
      } else {
        setRoomState('未配置', '本地模式');
      }
      loadAlternateSettings();
      renderChat();
      updateChatControls();
      fitCanvas(); updateRoleButtons(); updatePointerMode();
    })();
  </script>
</body>
</html>
